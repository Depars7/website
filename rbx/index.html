
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script Loader</title>
    <link rel="icon" sizes="80x80" href="https://depp.my.id/img/icon.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #09090b;
            color: #fafafa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #0a0a0c;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 20px 40px -12px rgba(0,0,0,0.5);
        }
        .logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        .logo svg { width: 32px; height: 32px; color: #fafafa; }
        .title h1 { font-size: 20px; font-weight: 700; color: #fafafa; margin-bottom: 8px; }
        .title p { color: rgba(255, 255, 255, 0.5); font-size: 14px; margin-bottom: 24px; }

        /* =========================
           GLOW ANIMATION
        ========================= */
        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 4px currentColor;
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 14px currentColor;
                transform: scale(1.25);
            }
            100% {
                box-shadow: 0 0 4px currentColor;
                transform: scale(1);
            }
        }

        /* =========================
           BASE BADGE
        ========================= */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            user-select: none;
            margin-bottom: 30px;
        }

        /* DOT */
        .badge::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
        }

        /* =========================
           STATUS VARIANTS
        ========================= */

        /* 🟢 ONLINE */
        .badge-online {
            color: #10b981;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.35);
        }
        .badge-online::before {
            animation: pulseGlow 1.4s infinite ease-in-out;
        }

        /* 🔴 OFFLINE */
        .badge-offline {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
        }
        .badge-offline::before {
            opacity: 0.6;
        }

        /* 🟡 MAINTENANCE */
        .badge-maintenance {
            color: #eab308;
            background: rgba(234, 179, 8, 0.12);
            border: 1px solid rgba(234, 179, 8, 0.35);
        }
        .badge-maintenance::before {
            animation: pulseGlow 2.4s infinite ease-in-out;
        }

        /* 🔵 IDLE */
        .badge-idle {
            color: #3b82f6;
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.35);
        }
        .badge-idle::before {
            box-shadow: 0 0 6px currentColor;
        }
        .message {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 20px;
            text-align: left;
            margin-bottom: 24px;
        }
        .message-icon { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; color: #fbbf24; font-weight: 600; font-size: 14px; }
        .message-icon svg { width: 18px; height: 18px; }
        .message p { color: rgba(255, 255, 255, 0.7); font-size: 13px; line-height: 1.6; }
        .code-block {
            background: #18181b;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px;
            position: relative;
            margin-bottom: 32px;
            text-align: left;
        }
        .code-block pre {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #a1a1aa;
            white-space: pre-wrap;
            word-break: break-all;
            padding-right: 40px;
        }
        .copy-btn {
            position: absolute;
            top: 12px; right: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #fafafa;
            cursor: pointer;
            padding: 6px;
            display: flex; align-items: center; gap: 6px;
            font-size: 12px; font-weight: 500;
            transition: all 0.2s;
        }
        .copy-btn:hover { background: rgba(255, 255, 255, 0.1); }
        .copy-btn svg { width: 14px; height: 14px; }
        .copy-btn span { display: none; }
        .copy-btn:hover span { display: inline; }
        .footer { display: flex; gap: 12px; justify-content: center; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px; font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-primary { background: #5865F2; color: #fff; }
        .btn-primary:hover { background: #4752c4; }
        .btn-secondary { background: rgba(255, 255, 255, 0.05); color: #fafafa; border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }
        .btn svg { width: 18px; height: 18px; }
    </style>
</head>
<body>

                <span id="copyText">Copy</span>

            <pre>loadstring(game:HttpGet("https://yourscript.com/loader"))()</pre>
        </div>

    <script>
        function copyCode() {
            const code = 'loadstring(game:HttpGet("https://yourscript.com/loader"))()';
            navigator.clipboard.writeText(code).then(() => {
                const btn = document.getElementById('copyText');
                btn.textContent = 'Copied!';
                setTimeout(() => btn.textContent = 'Copy', 2000);
            });
        }
    </script>
